# Integración continua: en cada cambio, GitHub corre las pruebas y construye la imagen Docker.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Pruebas con pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fase-2/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr pruebas
        run: python -m pytest -v

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase-2
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t nyc-taxi-propinas:fase2 .
      - name: Pruebas dentro del contenedor
        run: docker run --rm nyc-taxi-propinas:fase2 -m pytest -q
      - name: Predecir con la versión actual
        run: docker run --rm nyc-taxi-propinas:fase2 predict.py --entrada ejemplos/viajes_ejemplo.csv
      - name: Predecir con la versión de la Fase 1
        run: docker run --rm nyc-taxi-propinas:fase2 predict.py --entrada ejemplos/viajes_ejemplo.csv --version v1
